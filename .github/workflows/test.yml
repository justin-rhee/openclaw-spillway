name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show interpreter versions (a platform claim must match what ran)
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Typecheck against the pinned openclaw plugin SDK
        run: npm run typecheck

      - name: Run the offline suite
        run: npm test
