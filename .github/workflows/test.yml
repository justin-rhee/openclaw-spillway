name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Committed build output matches a fresh build
        shell: bash
        run: |
          # dist/ is committed because ClawHub publishes from the repo and refuses a
          # TypeScript entry with no compiled output. Committed build artifacts drift
          # from their source silently, so this rebuilds and refuses any difference.
          if [ -f tsconfig.build.json ]; then
            npm run build
            git diff --exit-code -- dist || {
              echo "dist/ differs from a fresh build. Run npm run build and commit the result." >&2
              exit 1
            }
          fi

      - name: Show interpreter versions (a platform claim must match what ran)
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Typecheck against the pinned openclaw plugin SDK
        run: npm run typecheck

      - name: Run the offline suite
        run: npm test
